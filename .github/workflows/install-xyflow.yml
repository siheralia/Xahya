name: Install XYFlow dependency for modular effect editor
on:
  push:
    branches: [feat/modular-skill-runtime-reactflow]
    paths:
      - .github/workflows/install-xyflow.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Generate the official dependency lock
        run: npm install @xyflow/react@12.12.1 --save-exact --package-lock-only --ignore-scripts
      - name: Commit dependency files to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): install @xyflow/react for modular effect editor"
            git push origin HEAD:feat/modular-skill-runtime-reactflow
          fi
