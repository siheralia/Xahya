name: Automated tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xahya_w04
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run tests
        run: npm test
      - name: Initialize isolated W04 test tables
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d xahya_w04 <<'SQL'
          CREATE TABLE public."characterResource" (
            id integer PRIMARY KEY,
            "characterId" integer UNIQUE NOT NULL,
            money integer NOT NULL,
            karma integer NOT NULL,
            "blackjackState" jsonb,
            "levelUpPoints" integer NOT NULL DEFAULT 0
          );
          CREATE TABLE public."w04Audit" (
            id integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
            "characterId" integer NOT NULL
          );
          INSERT INTO public."characterResource" (id, "characterId", money, karma)
          VALUES (1,1,100,1),(2,2,100,1);
          CREATE TABLE public."pchTestCharacter" (id integer PRIMARY KEY, "pchBalance" integer NOT NULL DEFAULT 0);
          CREATE TABLE public."pchTestCoin" (id integer PRIMARY KEY, "characterId" integer NOT NULL, quantity integer NOT NULL CHECK (quantity >= 0));
          CREATE TABLE public."pchTestSkill" (id integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY, "characterId" integer NOT NULL, "pchCost" integer NOT NULL);
          CREATE TABLE public."pchTestAudit" (id integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY, action text NOT NULL, "characterId" integer NOT NULL);
          INSERT INTO public."pchTestCharacter" (id,"pchBalance") VALUES (1,0),(2,10),(3,10),(4,0);
          INSERT INTO public."pchTestCoin" (id,"characterId",quantity) VALUES (1,1,1),(2,4,1);
          SQL
      - name: W04 PostgreSQL ORM integration
        run: node --test tests/w04-postgres.integration.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/xahya_w04
      - name: PCH PostgreSQL transaction integration
        run: node --test tests/pch-postgres.integration.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/xahya_w04
      - name: Generate Next.js route types
        run: npx next typegen
      - name: TypeScript typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jb20k
          CLERK_SECRET_KEY: sk_test_placeholder
