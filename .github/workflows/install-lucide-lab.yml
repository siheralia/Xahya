name: Install Lucide Lab dependency
on:
  push:
    branches: [chore/install-lucide-lab]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Install package and update lockfile
        run: npm install @lucide/lab --package-lock-only --ignore-scripts
      - name: Commit dependency manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: add @lucide/lab dependency"
            git push
          fi
