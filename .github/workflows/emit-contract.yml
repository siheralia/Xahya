name: Emit Prisma contract

on:
  push:
    branches: [main]
    paths:
      - "prisma/contract.prisma"
      - "prisma.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/emit-contract.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Emit contract
        run: npx prisma contract emit

      - name: Commit generated contract artifacts
        run: |
          if git diff --quiet -- prisma/contract.json prisma/contract.d.ts; then
            echo "Contract artifacts are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/contract.json prisma/contract.d.ts
          git commit -m "chore: regenerate prisma contract [skip ci]"
          git push
